# The library's half of nvidia/ada.yml: the keys nbxtensor reads (its docs/device_keys.txt),
# moved with their sources by tools/split_vendor_files.py. NeuroBrix's half stays in
# src/neurobrix/config/vendors/nvidia/ada.yml; the engine reads the two merged.

# Identity. `architecture` is the name the detector gives compute capability 8.9
# (core/prism/autodetect.py `_NVIDIA_ARCH_MAP` / `_NVIDIA_ARCH_REFINE`); the capability is how the kernels'
# resolver finds this file (core/config/loader.py `vendor_config_for_device`).
architecture: ada
compute_capability: "8.9"

memory:
  # The runtime's own context outside every allocator block: not measured on this class yet; null = the chunk
  # rule reads it once at its first ask, said by name (memory/chunk_rule.py). A measured figure replaces null.
  runtime_context_mb: null
  # SOURCE: https://docs.nvidia.com/cuda/cuda-programming-guide/05-appendices/compute-capabilities.html, read 2026-11-17,
  # Table 34 "Memory Information per Compute Capability", column 8.9: "Maximum amount of shared memory per
  # thread block: 99 KB" (with explicit opt-in; the page states 1 KB = 1024 bytes). 99 x 1024 = 101376.
  # (Per SM: 100 KB.)
  max_shared_memory_per_block: 101376
  # SOURCE: same table, "Maximum number of 32-bit registers per thread block: 64 K" (1 K = 1024).
  max_registers_per_block: 65536
  # SOURCE: same table, "Maximum number of 32-bit registers per thread: 255".
  max_registers_per_thread: 255
  # SOURCE: same page, Table 33 "Device and Streaming Multiprocessor (SM) Information per Compute Capability":
  # "Warp size: 32".
  warp_size: 32
precision:
  # The two lines below are not card values. kernels_carry_fp64 is a CAPABILITY of each branch's own kernels:
  # ATen carries float64 wherever the device does; Triton lowers double on the CUDA backend. stores_fp64 is the
  # DtypeEngine's POLICY (the Triton branch is fp32-max). Read by `config.device_supports_fp64`.
  kernels_carry_fp64:
    compiled: true
    triton: true
  # Attention operands that disagree in dtype take the narrowest: an engine POLICY (the half attention stays on the
  # matrix unit), not a card value; read by `dtype.attention_operand_alignment`.
  attention_operands: narrowest

# NOT MEASURED on this architecture: the values that say so. The flash kernel at a power-of-two head dim >= 128
# keeps its zero-pad detour (true only where the correctness oracle ran with the detour off on the arch).
flash:
  pow2_head_dim_correct: false
# Convolution weights stay in the container's own order (KCRS) until KRSC is measured faster on the arch.
conv:
  weight_layout: KCRS

autotune:
  # a sweep candidate whose compile does not end within this bound is excluded and kept, never a hang
  # (backend/compile_bound.py): every class that compiles Triton kernels states it at its source;
  # 120 s, the bound measured against on the V100 (moe_route candidates 4.2-14.7 s, three never returned)
  compile_bound_s: 120
