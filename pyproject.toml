[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nbxtensor"
version = "0.1.11"
description = "Run AI models without PyTorch: tensors, Triton kernels, planned memory and certified tuning, wherever Triton runs — NVIDIA, AMD, Intel and Apple GPUs."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Hocine Benkelaya", email = "contact@neurobrix.org" }]
maintainers = [{ name = "Hocine Benkelaya", email = "contact@neurobrix.org" }]
# numpy, triton, pyyaml (the dtype table is a YAML file) and, on Linux, the CUDA runtime. torch is never a dependency, not even an optional one:
# nbxtensor never imports torch (R-NBXT 6). Exchange with any other tensor
# library goes through DLPack, which the OTHER library imports.
# On Linux the CUDA runtime library its CUDA backend opens (libcudart.so.12), which the NVIDIA driver does not ship: a clean
# machine with only the driver found no GPU runtime and the engine read the card as CPU-only (the stable's install test,
# 2026-11-05). On a machine without an NVIDIA card it is a library nothing opens.
# Triton only where PyPI publishes it: its wheels are manylinux x86_64 and aarch64 alone (triton 3.9.0 and every release
# before it, no sdist), so a triton asked for on Windows or a Mac has no solution and the library did not install there
# (macOS 2026-11-06, native Windows 2026-11-18). The Metal Triton is built from source, with triton-ext's AppleGPU
# backend (the README's install, `install-metal`); on a Mac the Metal device is opened through pyobjc's Metal framework.
# The Triton floor is 3.5.0, read from the code: the launch path calls JITFunction._pack_args (first in 3.5.0) and
# JITFunction.is_gluon (3.4.0) with no fallback, and the tuning keywords (restore_value 3.0, do_bench 3.2), tl.assume (3.2)
# and triton.backends.compiler (3.0) all come earlier. A test reads this line and the installed Triton against it.
dependencies = ["numpy", "triton>=3.5.0; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')",
                "pyyaml", "nvidia-cuda-runtime-cu12; platform_system == 'Linux'",
                "pyobjc-framework-Metal; platform_system == 'Darwin'"]

[project.urls]
Homepage = "https://github.com/NeuroBrix/nbxtensor"
Source = "https://github.com/NeuroBrix/nbxtensor"
Issues = "https://github.com/NeuroBrix/nbxtensor/issues"
Changelog = "https://github.com/NeuroBrix/nbxtensor/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/nbxtensor"]

# The code taken from other projects, with their licenses, ships inside the package (the sdist carries it at the root).
[tool.hatch.build.targets.wheel.force-include]
"THIRD_PARTY_NOTICES.md" = "nbxtensor/THIRD_PARTY_NOTICES.md"
